name: Production monitor


on:
  schedule:
    - cron: '*/5 * * * *' 
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  id-token: write
  actions: read
  deployments: read

concurrency:
  group: production-monitor
  cancel-in-progress: false

env:
  REPO: dewnuwan7/azure-multi-env-cicd-pipeline

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      failed: ${{ steps.probe.outputs.failed }}
      probes: ${{ steps.probe.outputs.probes }}
      checked_at: ${{ steps.probe.outputs.checked_at }}
    steps:
      - name: Probe production health, up to three attempts
        id: probe
        env:
          PROD_URL: ${{ vars.PROD_URL }}
        run: |
          FAILED=true
          RESULTS=""
          for i in 1 2 3; do
            if curl -fsS --max-time 10 "$PROD_URL/health" > /dev/null; then
              RESULTS="$RESULTS ok"
              FAILED=false
              break
            fi
            RESULTS="$RESULTS fail"
            [ "$i" -lt 3 ] && sleep 30
          done
          echo "failed=$FAILED" >> "$GITHUB_OUTPUT"
          echo "probes=${RESULTS# }" >> "$GITHUB_OUTPUT"
          echo "checked_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "Probes:${RESULTS}"

  # Cooldown: 1 automatic rollback per 30 minutes. Inside the window, the monitor keeps
  # probing, and records continued failure as a comment on the existing incident issue.
  guard:
    needs: check
    if: needs.check.outputs.failed == 'true'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    outputs:
      allow: ${{ steps.window.outputs.allow }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check the cooldown
        id: window
        run: |
          LAST=$(gh issue list --repo $REPO --label auto-rollback --state all --limit 1 \
            --json number,createdAt --jq '.[0] // empty')
          if [ -z "$LAST" ]; then
            echo "allow=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          NUMBER=$(echo "$LAST" | jq -r '.number')
          CREATED=$(echo "$LAST" | jq -r '.createdAt')
          AGE=$(( $(date +%s) - $(date -d "$CREATED" +%s) ))
          if [ "$AGE" -lt 1800 ]; then
            echo "allow=false" >> "$GITHUB_OUTPUT"
            gh issue comment "$NUMBER" --repo $REPO --body "Still failing at ${{ needs.check.outputs.checked_at }}. Probes: ${{ needs.check.outputs.probes }}. Cooldown is active, so no rollback was attempted. Check production manually."
            echo "Cooldown active ($AGE seconds since the last automatic rollback). Recorded on issue #$NUMBER."
          else
            echo "allow=true" >> "$GITHUB_OUTPUT"
          fi

  rollback:
    needs: [check, guard]
    if: needs.check.outputs.failed == 'true' && needs.guard.outputs.allow == 'true'
    uses: ./.github/workflows/rollback.yml
    with:
      gate: production-auto
      dry_run: false

  record:
    needs: [check, guard, rollback]
    if: always() && needs.check.outputs.failed == 'true' && needs.guard.outputs.allow == 'true'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      DECISION: ${{ needs.rollback.outputs.decision }}
      REASON: ${{ needs.rollback.outputs.reason }}
      RESULT: ${{ needs.rollback.outputs.result }}
      LIVE_REV: ${{ needs.rollback.outputs.live_revision }}
      TARGET_REV: ${{ needs.rollback.outputs.target_revision }}
      TARGET_IMAGE: ${{ needs.rollback.outputs.target_image }}
      PROBES: ${{ needs.check.outputs.probes }}
      CHECKED_AT: ${{ needs.check.outputs.checked_at }}
    steps:
      - name: Open the incident issue
        run: |
          gh label create auto-rollback --repo $REPO --color B60205 \
            --description "Automatic production rollback" --force

          LIVE_SHA=${LIVE_REV#nodeapp-prod--}
          TARGET_SHA=${TARGET_REV#nodeapp-prod--}

          if [ "$RESULT" = "rolled-back" ]; then
            TITLE="[auto-rollback] nodeapp-prod reverted from $LIVE_SHA to $TARGET_SHA"
            OUTCOME="Rolled back. Traffic moved to the last version."
          elif [ "$DECISION" = "abort" ]; then
            TITLE="[auto-rollback] nodeapp-prod failing; rollback NOT applied"
            OUTCOME="The plan was aborted: ${REASON}. Review production manually."
          else
            TITLE="[auto-rollback] nodeapp-prod rollback DID NOT COMPLETE (${RESULT:-no result})"
            OUTCOME="The rollback did not complete. Act now."
          fi

          BODY=$(cat <<EOF
          **Outcome:** $OUTCOME

          | Field | Value |
          |---|---|
          | First failed probe check | $CHECKED_AT |
          | Probe results | $PROBES |
          | Live revision when planned | $LIVE_REV |
          | Target revision | $TARGET_REV |
          | Target image | $TARGET_IMAGE |
          | Plan decision | $DECISION |
          | Apply result | ${RESULT:-not run} |
          | Cooldown active | no |
          | Monitor commit | $GITHUB_SHA |
          | Workflow run | $GITHUB_SERVER_URL/$REPO/actions/runs/$GITHUB_RUN_ID |

          EOF
          )

          gh issue create --repo $REPO --label auto-rollback --title "$TITLE" --body "$BODY"